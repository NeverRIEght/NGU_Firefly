# A generic, single database configuration.

[alembic]
# Path to migration scripts
script_location = app/db/migrations

# Template used to generate migration files (e.g. 00001_initial_schema.py)
file_template = %%(rev)s_%%(slug)s

# Prepend current directory to sys.path
prepend_sys_path = .
path_separator = os

# Output encoding used when revision files are written
output_encoding = utf-8

# sqlalchemy.url is intentionally omitted.
# DatabaseManager dynamically provides the database engine at runtime in env.py.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
